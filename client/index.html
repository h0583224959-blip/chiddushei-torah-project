<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מאגר פריטים</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <header class="navbar">
    <div class="logo">מאגר פריטים</div>
    <div class="user-info">
      <span id="userNameDisplay">שלום, משתמש</span>
      <a href="login.html" id="authActionBtn" class="btn logout-btn">כניסה</a>
    </div>
  </header>

  <main class="main-content">
    <section class="search-section">
      <input type="text" id="search-input" class="search-input" placeholder="חיפוש לפי כותרת או מחבר...">
    </section>

    <!-- טופס העלאת פריט -->
    <section class="upload-section admin-only">
      <form class="upload-form" id="upload-form">
        <div class="form-group">
          <label for="title">כותרת:</label>
          <input type="text" id="title" name="title" class="form-input" required>
        </div>
        <div class="form-group">
          <label for="author">מחבר:</label>
          <input type="text" id="author" name="author" class="form-input" required>
        </div>
        <div class="form-group">
          <label for="description">תיאור:</label>
          <input type="text" id="description" name="description" class="form-input">
        </div>
        <div class="form-group">
          <label for="file">קובץ:</label>
          <input type="file" id="file" name="audio" class="form-input" required>
        </div>
        <button type="submit" class="btn submit-btn">העלאת פריט</button>
      </form>
    </section>

    <!-- מיכל כרטיסי הפריטים -->
    <section id="items-container" class="items-grid"></section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
