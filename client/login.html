<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>התחברות למערכת</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <main class="auth-container">
    <h1 class="auth-title">כניסה למערכת</h1>
    <p class="auth-subtitle">הזינו פרטי גישה להמשך</p>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">שם משתמש</label>
        <input type="text" id="username" class="form-input" required autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">סיסמה</label>
        <input type="password" id="password" class="form-input" required autocomplete="current-password">
      </div>

      <button type="submit" class="auth-btn">התחברות</button>
    </form>
  </main>

  <script src="js/auth.js"></script>
</body>
</html>
