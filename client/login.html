<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>התחברות למערכת</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <main class="auth-container">
    <h1 class="auth-title">כניסה למערכת</h1>
    <p class="auth-subtitle">הזינו פרטי גישה להמשך</p>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">כתובת אימייל</label>
        <input type="email" id="username" class="form-input" required autocomplete="email">
      </div>

      <div class="form-group">
        <label for="password">סיסמה</label>
        <input type="password" id="password" class="form-input" required autocomplete="current-password">
      </div>

      <button type="submit" class="auth-btn">התחברות</button>
      <button type="button" class="auth-switch" id="showRegister">אין לך חשבון? יצירת חשבון משתמש</button>
    </form>

    <form id="registerForm" hidden>
      <div class="form-group">
        <label for="registerName">שם</label>
        <input type="text" id="registerName" class="form-input" required autocomplete="name">
      </div>

      <div class="form-group">
        <label for="registerEmail">כתובת אימייל</label>
        <input type="email" id="registerEmail" class="form-input" required autocomplete="email">
      </div>

      <div class="form-group">
        <label for="registerPassword">סיסמה לבחירתך</label>
        <input type="password" id="registerPassword" class="form-input" required minlength="8" autocomplete="new-password">
      </div>

      <button type="submit" class="auth-btn">יצירת חשבון</button>
      <button type="button" class="auth-switch" id="showLogin">כבר יש לך חשבון? מעבר להתחברות</button>
    </form>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
